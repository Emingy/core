name: CI Checks

on:
    pull_request:
        branches: [master]

jobs:
    tests:
        name: 🧪 Testing (Unit)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Prepare
              uses: ./.github/actions/prepare-project/

            - name: Testing
              run: pnpm test
              shell: bash

    checks:
        name: 🔍 Static Analysis & Code Quality
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Prepare
              uses: ./.github/actions/prepare-project/

            - name: Checks
              uses: ./.github/actions/checks/

    build:
        name: 🏗️ Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Prepare
              uses: ./.github/actions/prepare-project/

            - name: Check packages build
              run: pnpm build

    playwright:
        name: 🎭 Playwright Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Build Playwright image
              run: docker compose build playwright

            - name: Run Playwright tests
              run: docker compose run --rm playwright

            - name: Upload test results
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-results
                  path: test-results/
                  retention-days: 7
